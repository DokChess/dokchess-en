apply plugin: 'idea'
apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// See
// http://selimober.com/blog/2014/01/24/separate-unit-and-integration-tests-using-gradle/
sourceSets {
    integTest {
        java.srcDir file('src/integTest/java')
    }
}

configurations {
    integTestImplementation.extendsFrom testImplementation
    integTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integTest.output.classesDirs
    classpath = sourceSets.integTest.runtimeClasspath
    useJUnit()
}

tasks.named('check') {
    dependsOn -= 'integTest'
}

tasks.named('test', Test) {
    useJUnit()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.reactivex:rxjava:1.0.0'
    testImplementation 'junit:junit:4.12'

    integTestImplementation sourceSets.main.output
    integTestImplementation sourceSets.test.output
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }
    manifest {
        attributes 'Main-Class': 'org.dokchess.Main'
    }
}

tasks.register('uberjar') {
    dependsOn tasks.jar
    group = 'build'
    description = 'Same as jar: fat JAR with Main-Class and runtime dependencies.'
}
